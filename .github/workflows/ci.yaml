name: CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "workflow/**"
      - ".tests/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "workflow/**"
      - ".tests/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Linting
        working-directory: .tests/integration
        run: snakemake --lint -n -s ../../workflow/Snakefile --configfile config.yaml

  snakefmt:
    name: Snakefmt
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FOLDER: .github/linters/report
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_SNAKEMAKE_SNAKEFMT: true

  dry-run:
    name: Snakemake dry run
    runs-on: ubuntu-latest
    needs: [lint, snakefmt]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snakemake dry run
        working-directory: .tests/integration
        run: snakemake -n -s ../../workflow/Snakefile

  compatibility:
    name: Compatibility test
    runs-on: ubuntu-latest
    needs: [dry-run]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Snakemake dry run
        working-directory: .tests/compatibility
        run: snakemake -n -s Snakefile --configfile config.yaml
